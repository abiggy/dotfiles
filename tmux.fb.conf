# tmux.fb.conf — Facebook devserver tmux defaults (the former ~/.tmux.conf).
# Sourced LAST by ~/dotfiles/.tmux.conf so these take PRECEDENCE over personal
# settings where they overlap (per Adam, 2026-06-09). Personal customizations
# live in ~/dotfiles/.tmux.conf; keep this file close to FB's recommended config.
# No leading dot in the filename on purpose: symlink.sh only auto-links .dotfiles,
# so this stays repo-only and is pulled in via `source-file` instead.
# See https://fburl.com/tmux for more info.
set -g default-command "${SHELL}"
set -g history-limit 500000
set -g status-right "#{s/.facebook.com//:host} • %Y-%m-%d %H:%M"
set -s default-terminal "tmux-256color"
set -s escape-time 0
set -g set-clipboard off
